[project]
name = "wind-analytics-backend"
version = "1.0.0"
description = "FastAPI backend for wind generation analytics"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
